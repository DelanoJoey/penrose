name: gate

on:
  pull_request:
  push:
    branches: [main]

# A PR that supersedes an in-flight run should cancel it.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: build + determinism gate
    runs-on: ubuntu-latest
    # 30, not 20. The gate step went from ~30s to 10m41s when the P3 art
    # direction landed, which is 53% of a 20-minute budget and would have made
    # the next scene change break CI rather than merely slow it.
    #
    # MEASURED CAUSE, not guessed: triangles per frame went 208 -> 128,400, and
    # 128,000 of those are the paper ground's PlaneGeometry(1,1,320,200). CI has
    # no GPU and rasterises via SwiftShader, so re-rendering that static backdrop
    # for all 90 settle frames of each of 9 shots, twice, is the whole cost.
    # Reproduced locally by forcing --use-gl=swiftshader: 4.4s per shot for
    # pump(90)+screenshot, versus milliseconds on Metal.
    #
    # This is headroom, NOT a fix. The real fix is to bake the paper once into a
    # render target and draw one textured quad, taking it from 128,000 triangles
    # to 2 while preserving the art exactly. That is an art-owner decision
    # because it trades textures 0 -> 1, so it is deliberately not done here.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      # A level with no impossible edges is an ordinary staircase, and one
      # solvable in every rotation does not use its own mechanic. Both are
      # design regressions that no pixel diff would catch, so they are asserted
      # here instead. tools/analyze.mjs exits non-zero on either.
      - name: Level design asserts
        run: |
          levels=$(node -e "import('./src/world/levels.js').then(m => console.log(Object.keys(m.LEVELS).join(' ')))")
          echo "levels: $levels"
          test -n "$levels" || { echo "no levels discovered"; exit 1; }
          for level in $levels; do
            echo "--- $level"
            node tools/analyze.mjs "$level"
          done

      - name: Build
        run: npx vite build

      # The gate is a SELF-CONSISTENCY check: it captures the full shot set
      # twice on this runner and requires the two runs to be pixel-identical.
      # That is what makes it portable. Committed reference PNGs would not be —
      # this runner has no GPU and rasterises via SwiftShader, so its pixels
      # legitimately differ from any developer machine. Comparing a run against
      # another run on the SAME machine is the comparison that means something.
      #
      # A failure here means the engine has nondeterminism, and every downstream
      # claim about performance or refactoring is unfalsifiable until it is fixed.
      - name: Determinism gate
        run: node tools/gate.mjs --port=5199

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-diffs
          path: /tmp/penrose-gate-*/
          if-no-files-found: ignore
          retention-days: 7
